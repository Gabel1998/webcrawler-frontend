name: Build & Push Showroom

on:
  push:
    branches: [showroom]

permissions:
  contents: read
  packages: write

jobs:
  push-images:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_WEBCRAWLER_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gabel1998/webcrawler/frontend:showroom
            ghcr.io/gabel1998/webcrawler/frontend:showroom-${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/gabel1998/webcrawler/frontend:showroom-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
